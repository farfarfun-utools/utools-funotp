name: Release

# 打 v* 标签就出一个可以直接拖进 uTools 的 upx 包。
# 手动触发留着是为了重跑失败的发版，不用再动标签。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - uses: actions/setup-node@v4
        with:
          # 发版这一趟会跑 build.sh，里面带着单测，所以必须是 22+：jsdom 30 依赖的
          # undici 8 用了 Node 22.10 才有的 markAsUncloneable，Node 20 上测试直接炸。
          # 插件跑在 uTools 内置的 Chromium 里，用哪个 Node 构建都不影响产物。
          node-version: '22'
          cache: pnpm

      # 发版这一趟不跳检查：这是最后一道关。
      # build.sh 里会校验 plugin.json / package.json / CHANGELOG 的版本号是否一致。
      - name: Build plugin
        run: ./build.sh

      # 标签和 package.json 对不上就不该发出去——uTools 商店认 plugin.json 里的版本号，
      # 标签只是个名字，两边不一致的话没人能从标签找回这包是哪个版本。
      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag=${GITHUB_REF#refs/tags/v}
          version=$(node -p "require('./package.json').version")
          test "$tag" = "$version" || {
            echo "error: 标签 v$tag 与 package.json 版本 $version 不一致" >&2
            exit 1
          }

      # upx 就是个 zip：plugin.json 必须在压缩包根目录，所以要在 utools/ 里面打。
      #
      # 文件名的前缀是仓库名（utools-funotp）而不是插件名（funotp）：farfarfun/packages
      # 那边按 `<包名>-<版本>.upx` 认附件，而那边的包名一律等于仓库名。用
      # $GITHUB_REPOSITORY 算而不是抄一遍字面量 —— 仓库万一改名，附件名自己跟着改，
      # 不用指望有人记得回来改这一行。
      - name: Pack upx
        run: |
          pkg=${GITHUB_REPOSITORY#*/}
          version=$(node -p "require('./package.json').version")
          cd utools
          zip -r -q "../$pkg-$version.upx" \
            plugin.json preload.js webdav.js logo.png search.png dist
          cd ..
          unzip -l "$pkg-$version.upx"
          echo "PACKAGE=$pkg-$version.upx" >> "$GITHUB_ENV"

      # 校验和必须覆盖这次发布的全部附件，所以排在打包之后、建 release 之前。
      # farfarfun/packages 的站点按它给出那条校验和链接，约定见那边的
      # docs/package-spec.md 第 1.3 节。
      - name: Write SHA256SUMS
        run: |
          sha256sum "$PACKAGE" >SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" "$PACKAGE" SHA256SUMS \
            --title "${GITHUB_REF#refs/tags/}" \
            --notes "安装：下载 $PACKAGE 后拖进 uTools 窗口。更新内容见 CHANGELOG.md。" \
            --verify-tag

      # 手动触发时没有标签，产物挂在这次运行上，方便先装上试一下再决定要不要发。
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: funotp-upx
          path: ${{ env.PACKAGE }}
          retention-days: 30
