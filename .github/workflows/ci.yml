name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 是测试工具链的硬下限：jsdom 30 依赖 undici 8，而 undici 8 直接用了
        # Node 22.10 才有的 worker_threads.markAsUncloneable，Node 20 上所有
        # jsdom 环境的测试文件一加载就炸。插件本身跑在 uTools 内置的 Chromium 里，
        # 构建用哪个 Node 不影响产物，所以这里跟着工具链走。
        # 24 用来提前发现新版本上的问题。
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # build.sh 还会校验 preload.js、plugin.json、版本号一致性和打包产物的完整性。
      # 上面三步已经跑过检查了，这里跳过，省掉一整轮重复的 lint / typecheck / test。
      - name: Build plugin
        run: ./build.sh
        env:
          SKIP_CHECKS: '1'

      # 只在下限那个版本上传一份就够了。这个条件必须跟着上面的矩阵改：原来写的是
      # node == '20'，而矩阵里早就没有 20 了，产物实际上从来没传上去过 —— 条件不成立
      # 的步骤会被跳过，流水线照样是绿的，所以这种错不会自己暴露。funlink 踩过同一个坑。
      # if-no-files-found: error 是第二道保险，管的是另一种情形：条件成立了，但 path
      # 里的文件名写错或产物没生成，上传一个空包同样是静默通过。
      - name: Upload plugin dist
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: utools-funotp
          path: |
            utools/dist
            utools/plugin.json
            utools/preload.js
            utools/webdav.js
            utools/logo.png
            utools/search.png
          if-no-files-found: error
          retention-days: 7

      - name: Package UPXS with organization secrets
        if: matrix.node == '22' && github.event_name != 'pull_request'
        uses: farfarfun-action/utools-devtools@c48e8ce06b6700d21c73917b3b16d6e5674c13ef # v0.1.4
        with:
          source: utools
          output: release/utools-funotp.upxs
          identity-file: identity.json
          mid: ${{ secrets.UTOOLS_MID }}
          uid: ${{ secrets.UTOOLS_UID }}
          cellphone: ${{ secrets.UTOOLS_CELLPHONE }}
      - name: Checksum UPXS
        if: matrix.node == '22' && github.event_name != 'pull_request'
        run: cd release && sha256sum utools-funotp.upxs > SHA256SUMS
      - name: Upload UPXS installation preview
        if: matrix.node == '22' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: utools-funotp-upxs-preview
          path: release/
          if-no-files-found: error
