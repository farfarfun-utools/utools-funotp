name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 是测试工具链的硬下限：jsdom 30 依赖 undici 8，而 undici 8 直接用了
        # Node 22.10 才有的 worker_threads.markAsUncloneable，Node 20 上所有
        # jsdom 环境的测试文件一加载就炸。插件本身跑在 uTools 内置的 Chromium 里，
        # 构建用哪个 Node 不影响产物，所以这里跟着工具链走。
        # 24 用来提前发现新版本上的问题。
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # build.sh 还会校验 preload.js、plugin.json、版本号一致性和打包产物的完整性。
      # 上面三步已经跑过检查了，这里跳过，省掉一整轮重复的 lint / typecheck / test。
      - name: Build plugin
        run: ./build.sh
        env:
          SKIP_CHECKS: '1'

      - name: Upload plugin dist
        if: matrix.node == '20'
        uses: actions/upload-artifact@v4
        with:
          name: utools-funotp
          path: |
            utools/dist
            utools/plugin.json
            utools/preload.js
            utools/webdav.js
            utools/logo.png
            utools/search.png
          retention-days: 7
